server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # O Next gera os assets com hash no nome: se o conteúdo muda, o nome muda.
  # Logo é seguro cachear para sempre.
  location /_next/static/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  # O HTML carrega os dados do relatório; precisa revalidar a cada deploy.
  location ~* \.html$ {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # O next.config usa trailingSlash, então /secao/ resolve para /secao/index.html.
  location / {
    try_files $uri $uri/index.html $uri/ /index.html;
  }

  error_page 404 /404.html;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Health check do EasyPanel sem poluir o log.
  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # O Next gera os assets com hash no nome: se o conteúdo muda, o nome muda.
  # Logo é seguro cachear para sempre. Sem `expires` junto, senão o nginx emite
  # dois cabeçalhos Cache-Control na mesma resposta.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  # O HTML carrega os dados do relatório; precisa revalidar a cada deploy.
  # O cabeçalho fica aqui, e não num `location ~* \.html$`, porque a página
  # inicial é pedida como "/" — aquela regex nunca pegaria o caso principal.
  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # Sem o `=404` acima, qualquer endereço inexistente devolvia o relatório
  # inteiro com status 200.
  error_page 404 /404.html;

  location = /404.html {
    internal;
    add_header Cache-Control "no-cache, must-revalidate";
  }

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Health check do EasyPanel sem poluir o log.
  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }
}
